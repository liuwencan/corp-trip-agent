server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

spring:
  application:
    name: corp-trip-agent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 请在本地配置文件或环境变量中配置数据库连接地址、用户名和密码，不要提交真实凭据。
    url: xxx
    username: xxx
    password: xxx
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 启用认证时，请在本地配置文件或环境变量中配置密码，不要提交真实凭据。
      password: xxx
      database: 4
      connect-timeout: 3s
      timeout: 3s
      lettuce:
        shutdown-timeout: 2s

sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 前缀
  token-prefix: Bearer
  # token 有效期（单位：秒），默认 30 天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），-1 代表不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 多人登录同一账号时是否共用 token
  is-share: true
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    cn.lwccxy.corptrip: INFO
    io.agentscope.core: INFO

# 项目自定义配置
corp:
  trip:
    # 请在本地配置文件或环境变量中配置新闻服务 API Key，不要提交真实密钥。
    news-api-key: xxx
    skillspath: classpath:skills
    weather-mcp:
      enabled-tools: 城市天气实况,城市15日预报,城市天气预警,城市空气实况,城市24小时预报,城市40日预报

# 途牛 API Key 请在本地配置文件或环境变量中设置，不要提交真实密钥。
